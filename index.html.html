function speak(t){if(!('speechSynthesis' in window)){alert('這個瀏覽器暫時不支援語音播放');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.82;let v=speechSynthesis.getVoices().find(x=>x.lang.toLowerCase().startsWith('ja'));if(v)u.voice=v;speechSynthesis.speak(u)}function update(){let level=Math.floor(state.xp/100)+1;$('levelText').textContent='Lv. '+level;$('xpText').textContent=(state.xp%100)+'/100 XP';$('xpbar').style.width=(state.xp%100)+'%';$('streak').textContent=state.lastCheck===today()||state.lastCheck===yesterday()?state.streak:0;$('total').textContent=state.correct;$('accuracy').textContent=state.attempts?Math.round(state.correct/state.attempts*100)+'%':'—';$('checkin').disabled=state.lastCheck===today();$('checkinText').textContent=state.lastCheck===today()?'今天已簽到，明天再來領 20 XP ♡':'每天簽到可領 20 XP';$('mistakeCount').textContent=Object.keys(state.mistakes).length}function checkin(){if(state.lastCheck===today())return;state.streak=state.lastCheck===yesterday()?state.streak+1:1;state.lastCheck=today();state.xp+=20;save();update();$('mascotMsg').textContent='簽到成功！今天也很棒 🌸'}function showHome(){$('play').classList.add('hidden');$('home').classList.remove('hidden');update();window.scrollTo(0,0)}function start(g){game=g;idx=0;score=0;answered=false;flashRevealed=false;matchDone=0;$('home').classList.add('hidden');$('play').classList.remove('hidden');const titles={kana:'🎲 五十音混合挑戰',hiragana:'🌷 平假名快閃',katakana:'🌸 片假名快閃',flash:'📚 單字翻翻樂',scene:'🍱 旅遊情境對話',match:'🧩 配對消消樂',listen:'🎧 聽力猜猜看',daily:'🏆 每日隨機挑戰',mistakes:'📝 錯題複習',history:'📊 學習紀錄'};$('gameTitle').textContent=titles[g];if(g==='history'){renderHistory();return}if(g==='match'){startMatch();return}if(g==='mistakes'){round=shuffle(ALL.filter(x=>state.mistakes[x.id]));if(!round.length){$('gameBody').innerHTML='<p class="center">目前沒有錯題！繼續保持 ♡</p>';return}}else if(g==='hiragana')round=shuffle(K.slice(0,46)).slice(0,10);else if(g==='katakana')round=shuffle(K.slice(46)).slice(0,10);else if(g==='kana')round=shuffle(K).slice(0,10);else if(g==='flash')round=shuffle(W).slice(0,10);else if(g==='scene')round=shuffle(S).slice(0,10);else if(g==='listen')round=shuffle(W).slice(0,10);else round=shuffle([...shuffle(K).slice(0,4),...shuffle(W).slice(0,4),...shuffle(S).slice(0,2)]);render();window.scrollTo(0,0)}function addResult(item,ok){state.attempts++;if(ok){state.correct++;state.xp+=10;delete state.mistakes[item.id];score++}else state.mistakes[item.id]=(state.mistakes[item.id]||0)+1;save();update()}function choices(item){if(item.type==='scene')return shuffle(item.choices);let pool=item.type==='kana'?(game==='hiragana'?K.slice(0,46):game==='katakana'?K.slice(46):K):W;let distractors=shuffle([...new Set(pool.map(x=>x.zh).filter(x=>x!==item.zh))]).slice(0,3);return shuffle([item.zh,...distractors])}function render(){if(idx>=round.length){finish();return}answered=false;let x=round[idx];$('counter').textContent=(idx+1)+' / '+round.length;if(game==='flash'){flashRevealed=false;renderFlash();return}let listening=game==='listen';let jp=x.type==='scene'?x.jp:listening?'🎧':x.jp;let opts=choices(x);$('gameBody').innerHTML='<div class="question" id="q"></div><p class="prompt" id="hint"></p><div class="center"><button class="btn secondary" id="speak">🔊 播放日文</button></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="center"><button class="btn hidden" id="next">下一題 →</button></div>';$('q').textContent=jp;$('hint').textContent=x.type==='scene'?'選出適合這個情境的日文':listening?'先聽發音，再選出中文意思':x.type==='kana'?'這個假名怎麼念？':'這個日文是什麼意思？';$('speak').onclick=()=>speak(x.type==='scene'?x.zh:x.jp);if(x.type==='scene')$('speak').textContent='🔊 播放正確日文';if(listening)setTimeout(()=>speak(x.jp),250);opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=String(o??'');b.style.color='#524a44';b.style.webkitTextFillColor='#524a44';b.onclick=()=>{if(answered)return;answered=true;let ok=o===x.zh;addResult(x,ok);document.querySelectorAll('.option').forEach(el=>{el.disabled=true;if(el.textContent===x.zh)el.classList.add('correct');if(el===b&&!ok)el.classList.add('wrong')});$('feedback').textContent=ok?'🌸 答對了！ +10 XP':'🍡 再記住一次：'+x.zh;$('next').classList.remove('hidden')};$('options').append(b)});$('next').onclick=()=>{idx++;render()}}function renderFlash(){let x=round[idx];$('counter').textContent=(idx+1)+' / '+round.length;$('gameBody').innerHTML='<p class="prompt">先猜猜看這個日文的意思</p><div class="flash"><div class="center"><div class="jp" id="flashJp"></div><p id="flashMeaning"></p></div></div><div class="center toolbar" style="justify-content:center"><button class="btn secondary" id="speak">🔊 聽發音</button><button class="btn" id="reveal">翻開卡片 ✨</button></div><div class="center toolbar hidden" id="flashActions" style="justify-content:center;margin-top:16px"><button class="btn ghost" id="forgot">還不熟悉</button><button class="btn secondary" id="knew">我記住了！</button></div>';$('flashJp').textContent=x.jp;$('flashMeaning').textContent='❔';$('speak').onclick=()=>speak(x.jp);$('reveal').onclick=()=>{$('flashMeaning').textContent=x.zh;$('reveal').classList.add('hidden');$('flashActions').classList.remove('hidden')};$('forgot').onclick=()=>{addResult(x,false);idx++;render()};$('knew').onclick=()=>{addResult(x,true);idx++;render()}}function finish(){state.history.unshift({date:new Date().toLocaleString('zh-TW'),game,score,total:round.length});state.history=state.history.slice(0,60);save();$('counter').textContent='完成';$('gameBody').innerHTML='<div class="center" style="padding:28px 0"><div style="font-size:70px">🎉🐰</div><h2>挑戰完成！</h2><h1>'+score+' / '+round.length+'</h1><p>獲得 '+score*10+' XP！小糰子替你鼓掌 ♡</p><div class="toolbar" style="justify-content:center"><button class="btn" id="again">再玩一次</button><button class="btn ghost" id="goHome">回首頁</button></div></div>';$('again').onclick=()=>start(game);$('goHome').onclick=showHome}function startMatch(){matchPairs=shuffle(W).slice(0,6);matchSelected=null;matchDone=0;score=0;renderMatch()}function renderMatch(){let left=shuffle(matchPairs),right=shuffle(matchPairs);$('counter').textContent=matchDone+' / 6 組';$('gameBody').innerHTML='<p class="prompt">點選左側日文，再點右側中文，配對成功就能消除！</p><div class="matching"><div class="matchcol" id="left"></div><div class="matchcol" id="right"></div></div><div class="feedback" id="feedback"></div>';for(let [side,arr] of [['left',left],['right',right]])arr.forEach(x=>{let b=document.createElement('button');b.className='match';let label=side==='left'?x.jp:x.zh;b.textContent=String(label??'');b.setAttribute('aria-label',String(label??''));b.style.setProperty('color','#524a44','important');b.style.setProperty('-webkit-text-fill-color','#524a44','important');b.dataset.id=x.id;b.onclick=()=>{if(b.classList.contains('done'))return;if(side==='left'){document.querySelectorAll('#left .match').forEach(z=>z.classList.remove('selected'));b.classList.add('selected');matchSelected=x.id;return}if(!matchSelected){$('feedback').textContent='先選左邊的日文喔';return}let first=matchPairs.find(y=>y.id===matchSelected),ok=matchSelected===x.id;addResult(first,ok);if(ok){document.querySelectorAll('.match[data-id="'+x.id+'"]').forEach(z=>{z.classList.add('done');z.disabled=true});matchDone++;$('counter').textContent=matchDone+' / 6 組';$('feedback').textContent='🌸 配對成功！ +10 XP';if(matchDone===6){setTimeout(()=>{round=matchPairs;finish()},350)}}else{$('feedback').textContent='再試一次～ '+first.jp+' 是「'+first.zh+'」'}document.querySelectorAll('#left .match').forEach(z=>z.classList.remove('selected'));matchSelected=null};$(side).append(b)})}function renderHistory(){$('counter').textContent='最近 60 次';$('gameBody').innerHTML='<h2>📊 你的學習足跡</h2><p>累積 '+state.attempts+' 題，答對 '+state.correct+' 題，經驗值 '+state.xp+' XP。</p><div class="record" id="records"></div>';let el=$('records');if(!state.history.length)el.textContent='還沒有紀錄，先去玩一場吧！';state.history.forEach(h=>{let d=document.createElement('div');d.className='recordItem';d.textContent=h.date+' · '+({kana:'五十音混合',hiragana:'平假名',katakana:'片假名',flash:'翻翻樂',scene:'情境',match:'配對',listen:'聽力',daily:'每日挑戰',mistakes:'錯題複習'}[h.game]||h.game)+' · '+h.score+'/'+h.total;el.append(d)})}document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('homeBtn').onclick=showHome;$('back').onclick=showHome;$('checkin').onclick=checkin;$('showMistakes').onclick=()=>start('mistakes');$('showHistory').onclick=()=>start('history');update();
